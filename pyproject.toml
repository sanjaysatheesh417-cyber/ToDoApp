[project]

name = "ToDoApp"
version = "0.1.0"
description = "an app built to store your to do"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.35",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=21.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "pyjwt>=2.9.0",
    "argon2-cffi>=23.1.0",
    "slowapi>=0.1.9",
]

[dependency-groups]

dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]