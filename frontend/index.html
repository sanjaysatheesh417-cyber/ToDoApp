<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoApp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <section id="auth-section">
            <h2 id="auth-title">Sign in</h2>
            <form id="auth-form">
                <input
                id = "username-input"
                type = "text"
                placeholder="Username"
                autocomplete="username"
                required
                >

                <input
                id="password-input"
                type="password"
                placeholder="password"
                autocomplete="current-password"
                required
                >

                <button type="submit">Sign in</button>
                <button type="button" id="toggle-auth">Create account instead</button>
            </form>

            <p id="auth-message"></p>
        </section>
        <section id="tasks-section" hidden>
            <h1>My Tasks</h1>
            <div id="stats"></div>
            <form id="task-form">
                <input type="text" id="task-input" placeholder="what needs to be done?" required maxlength="255">
                <input type="datetime-local" id="time-input" required>
                <select id="importance-input">
                    <option value="high">High</option>
                    <option value="moderate">Moderate</option>
                    <option value="low">Low</option>
                </select>
                <button type="submit" id = "submit-btn">Add Task</button>
                <button type="button" id = "cancel-btn" hidden>Cancel</button>
            </form>
            <div class="filters">
                <select id="filter-status">
                    <option value="">All Statuses</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                </select>
                <select id="filter-importance">
                    <option value="">All importance</option>
                    <option value="high">High</option>
                    <option value="moderate">Moderate</option>
                    <option value="low">Low</option>
                </select>
                <input type="search" id="search-input" placeholder="Search tasks....">
            </div>
            <ul id="task-list"></ul>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
